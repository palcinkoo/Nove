name: Android Emulator Test

on:
  push:
    branches: [main]
    paths: ["android/**", "scripts/**", ".github/workflows/**"]
  workflow_dispatch:

jobs:
  emulator-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"

      - name: Build debug APK
        run: |
          cd android
          gradle assembleDebug --no-daemon

      - name: Run app on virtual Pixel 5
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 34 catches Android 14 foreground-service rules (declared types
          # require matching FOREGROUND_SERVICE_* permissions, otherwise
          # startForeground throws a SecurityException that kills the process).
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          script: bash scripts/emulator-test.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshots
          path: |
            /tmp/screen_*.png
            /tmp/logcat.txt
          if-no-files-found: error
